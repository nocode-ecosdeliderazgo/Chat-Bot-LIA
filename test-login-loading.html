<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Animación de Carga Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0A0A0A 0%, #0A0A0A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', Arial, sans-serif;
            padding: 20px;
        }

        .test-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 102, 204, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: #0066CC;
            border: 2px solid #0066CC;
            border-radius: 25px;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: #0052A3;
            border-color: #0052A3;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 102, 204, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 16px rgba(0, 102, 204, 0.2);
        }

        .btn-primary.loading {
            animation: buttonPulse 2s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% {
                box-shadow: 0 4px 16px rgba(0, 102, 204, 0.3);
            }
            50% {
                box-shadow: 0 4px 24px rgba(0, 102, 204, 0.5);
            }
        }

        .btn-text {
            transition: opacity 0.3s ease;
        }

        .btn-loader {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center;
        }

        .btn-primary.loading .btn-loader {
            display: flex !important;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top: 3px solid #FFFFFF;
            border-right: 3px solid #FFFFFF;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: rgba(0, 102, 204, 0.1);
            border: 1px solid rgba(0, 102, 204, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            color: white;
        }

        .info-box h3 {
            color: #44E5FF;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .info-box p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #0066CC;
            border-radius: 20px;
            color: #0066CC;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(0, 102, 204, 0.1);
            border-color: #0052A3;
            color: #0052A3;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>✅ Test de Animación de Carga</h1>
        
        <form id="testForm">
            <button type="button" class="btn-primary" id="loginBtn">
                <span class="btn-text">Ingresar</span>
                <span class="btn-loader">
                    <span class="spinner"></span>
                </span>
            </button>
        </form>

        <div class="info-box">
            <h3>🎯 Mejoras Implementadas:</h3>
            <p>
                ✓ Texto del botón cambia a "Validando..."<br>
                ✓ Spinner visible y animado al lado del texto<br>
                ✓ Botón se deshabilita durante carga<br>
                ✓ Efecto de pulso en el botón<br>
                ✓ Transiciones suaves<br>
                ✓ Feedback visual claro dentro del botón
            </p>
        </div>

        <div class="controls">
            <button type="button" class="btn-secondary" onclick="simulateLogin()">
                🔄 Simular Login
            </button>
            <button type="button" class="btn-secondary" onclick="simulateError()">
                ❌ Simular Error
            </button>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        let isLoading = false;

        function setLoadingState(loading, loadingText = null) {
            isLoading = loading;
            const btnText = loginBtn.querySelector('.btn-text');
            const btnLoader = loginBtn.querySelector('.btn-loader');

            // Guardar el texto original si no existe
            if (!loginBtn.dataset.originalText && btnText) {
                loginBtn.dataset.originalText = btnText.textContent;
            }

            if (loading) {
                // Deshabilitar el botón y agregar clase de loading
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');
                loginBtn.style.cursor = 'not-allowed';

                // Cambiar el texto del botón y mostrar el spinner
                if (btnText) {
                    btnText.textContent = loadingText || 'Cargando...';
                    btnText.style.opacity = '1';
                    btnText.style.paddingRight = '30px'; // Espacio para el spinner
                }

                if (btnLoader) {
                    btnLoader.style.display = 'flex';
                    btnLoader.style.alignItems = 'center';
                    btnLoader.style.justifyContent = 'center';
                    btnLoader.style.position = 'absolute';
                    btnLoader.style.right = '20px';
                    btnLoader.style.top = '50%';
                    btnLoader.style.transform = 'translateY(-50%)';
                    btnLoader.style.width = '20px';
                    btnLoader.style.height = '20px';
                    btnLoader.style.zIndex = '100';
                    // Pequeño delay para asegurar que el spinner se vea
                    setTimeout(() => {
                        if (btnLoader) {
                            btnLoader.style.opacity = '1';
                            btnLoader.style.visibility = 'visible';
                        }
                    }, 100);
                }
            } else {
                // Habilitar el botón y quitar clase de loading
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                loginBtn.style.cursor = 'pointer';

                // Restaurar texto original y ocultar loader
                if (btnText && loginBtn.dataset.originalText) {
                    btnText.textContent = loginBtn.dataset.originalText;
                    btnText.style.paddingRight = '0';
                }

                if (btnLoader) {
                    btnLoader.style.opacity = '0';
                    btnLoader.style.visibility = 'hidden';
                    setTimeout(() => {
                        if (btnLoader) {
                            btnLoader.style.display = 'none';
                        }
                    }, 300);
                }
            }
        }

        function simulateLogin() {
            if (isLoading) return;
            
            console.log('🔄 Simulando proceso de login...');
            setLoadingState(true, 'Validando...');
            
            // Simular tiempo de respuesta del servidor (3 segundos)
            setTimeout(() => {
                setLoadingState(false);
                console.log('✅ Login exitoso simulado');
                alert('✅ ¡Login exitoso! La animación funcionó correctamente.');
            }, 3000);
        }

        function simulateError() {
            if (isLoading) return;
            
            console.log('🔄 Simulando proceso de login con error...');
            setLoadingState(true, 'Validando...');
            
            // Simular tiempo de respuesta del servidor con error (2 segundos)
            setTimeout(() => {
                setLoadingState(false);
                console.log('❌ Error simulado');
                alert('❌ Credenciales incorrectas (simulado)');
            }, 2000);
        }

        // Agregar listener para el botón principal
        loginBtn.addEventListener('click', simulateLogin);
    </script>
</body>
</html>
