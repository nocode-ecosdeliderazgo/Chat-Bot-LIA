<!DOCTYPE html>
<html>
<head>
    <title>Debug Registro - aprendeyaplica.ai</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; white-space: pre-wrap; }
        button { margin: 5px; padding: 10px 15px; }
        input { margin: 5px; padding: 8px; width: 200px; }
    </style>
</head>
<body>
    <h1>🔍 Debug Registro - aprendeyaplica.ai</h1>

    <div class="test-result info">
        <strong>Dominio actual:</strong> <span id="current-domain"></span><br>
        <strong>URL completa:</strong> <span id="current-url"></span>
    </div>

    <h2>Pruebas de Diagnóstico</h2>

    <button onclick="testDebugRegister()">🔍 Verificar Config SMTP</button>
    <button onclick="testSetupOTPs()">📋 Crear Tabla OTPs</button>
    <button onclick="clearResults()">🧹 Limpiar</button>

    <h2>Prueba de Registro</h2>
    <div>
        <input type="text" id="testEmail" placeholder="Email de prueba" value="test@example.com">
        <input type="text" id="testName" placeholder="Nombre" value="Usuario Test">
        <input type="text" id="testUsername" placeholder="Username" value="usertest">
        <button onclick="testRegister()">🔐 Probar Registro</button>
    </div>

    <div id="results"></div>

    <script>
        // Mostrar información del dominio actual
        document.getElementById('current-domain').textContent = window.location.hostname;
        document.getElementById('current-url').textContent = window.location.href;

        function addResult(title, content, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `
                <strong>${title}</strong>
                <pre>${typeof content === 'object' ? JSON.stringify(content, null, 2) : content}</pre>
            `;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDebugRegister() {
            addResult('🔍 Verificando configuración SMTP...', 'Consultando /api/debug-register');

            try {
                const response = await fetch('/api/debug-register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ test: 'smtp-config' })
                });

                const data = await response.json();

                if (response.ok) {
                    const smtpStatus = data.debug.smtpConfigured ? '✅ CONFIGURADO' : '❌ NO CONFIGURADO';
                    addResult(`SMTP Status: ${smtpStatus}`, data.debug, data.debug.smtpConfigured ? 'success' : 'error');
                } else {
                    addResult(`❌ Error verificando SMTP (${response.status})`, data, 'error');
                }
            } catch (error) {
                addResult('❌ Error de conexión verificando SMTP', error.message, 'error');
            }
        }

        async function testSetupOTPs() {
            addResult('📋 Creando tabla OTPs...', 'Ejecutando /api/setup-otps-table');

            try {
                const response = await fetch('/api/setup-otps-table', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'create' })
                });

                const data = await response.json();

                if (response.ok) {
                    addResult(`✅ Tabla OTPs: ${data.message}`, data, 'success');
                } else {
                    addResult(`❌ Error creando tabla OTPs (${response.status})`, data, 'error');
                }
            } catch (error) {
                addResult('❌ Error de conexión creando tabla OTPs', error.message, 'error');
            }
        }

        async function testRegister() {
            const email = document.getElementById('testEmail').value;
            const name = document.getElementById('testName').value;
            const username = document.getElementById('testUsername').value;

            if (!email || !name || !username) {
                addResult('❌ Error', 'Por favor llena todos los campos', 'error');
                return;
            }

            addResult('🔐 Probando registro...', `Email: ${email}, Nombre: ${name}, Username: ${username}`);

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: name,
                        username: username,
                        email: email,
                        password: 'password123'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const requiresVerification = data.requiresVerification ? '✅ SÍ' : '❌ NO';
                    const emailSent = data.requiresVerification && !data.emailError ? '✅ ENVIADO' : '❌ NO ENVIADO';

                    addResult(
                        `✅ Registro exitoso (${response.status})`,
                        `Usuario: ${data.user.email}\nRequiere verificación: ${requiresVerification}\nEmail: ${emailSent}\n\nRespuesta completa:\n${JSON.stringify(data, null, 2)}`,
                        'success'
                    );
                } else {
                    addResult(`❌ Error en registro (${response.status})`, data, 'error');
                }
            } catch (error) {
                addResult('❌ Error de conexión en registro', error.message, 'error');
            }
        }

        // Ejecutar verificación automática
        window.addEventListener('load', () => {
            setTimeout(testDebugRegister, 1000);
        });
    </script>
</body>
</html>
