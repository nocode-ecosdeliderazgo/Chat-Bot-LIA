<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test LIA Button Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        
        .message-type-selector {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(68, 229, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(68, 229, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .type-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 8px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #888;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .type-btn:hover {
            background: rgba(68, 229, 255, 0.1);
            color: white;
        }
        
        .type-btn.active {
            background: #44e5ff;
            color: #1a1a1a;
            border-color: #44e5ff;
            box-shadow: 0 2px 8px rgba(68, 229, 255, 0.3);
        }
        
        .type-btn i {
            font-size: 0.9rem;
        }
        
        .type-btn span {
            font-size: 0.7rem;
        }
        
        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #333;
            color: white;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #44e5ff;
            color: #1a1a1a;
            cursor: pointer;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .debug-info {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Test LIA Button Debug</h2>
        
        <div class="message-type-selector" id="messageTypeSelector">
            <button class="type-btn" data-type="lia" title="Enviar a LIA (Chatbot)">
                <i>🧠</i>
                <span>LIA</span>
            </button>
        </div>
        
        <div class="input-wrapper">
            <input 
                type="text" 
                id="livestreamMessageInput" 
                placeholder="Selecciona LIA para preguntar..."
                maxlength="200"
            >
            <button id="livestreamSendBtn" disabled>Enviar</button>
        </div>
        
        <div class="debug-info" id="debugInfo">
            Estado inicial...
        </div>
    </div>

    <script>
        // Estado del chat
        let livestreamChatState = {
            isConnected: false,
            username: 'TestUser',
            messageType: null,
            messages: [],
            connectedUsers: [],
            pendingMessages: []
        };

        // Elementos del DOM
        const messageInput = document.getElementById('livestreamMessageInput');
        const sendBtn = document.getElementById('livestreamSendBtn');
        const debugInfo = document.getElementById('debugInfo');

        function updateDebugInfo() {
            debugInfo.innerHTML = `
                <strong>Estado del Chat:</strong><br>
                messageType: ${livestreamChatState.messageType}<br>
                isConnected: ${livestreamChatState.isConnected}<br>
                username: ${livestreamChatState.username}<br>
                <br>
                <strong>Elementos DOM:</strong><br>
                messageInput existe: ${!!messageInput}<br>
                sendBtn existe: ${!!sendBtn}<br>
                sendBtn disabled: ${sendBtn ? sendBtn.disabled : 'N/A'}<br>
                <br>
                <strong>Botón LIA:</strong><br>
                botón existe: ${!!document.querySelector('[data-type="lia"]')}<br>
                tiene clase active: ${document.querySelector('[data-type="lia"]')?.classList.contains('active')}<br>
                <br>
                <strong>Input:</strong><br>
                placeholder: ${messageInput ? messageInput.placeholder : 'N/A'}<br>
                valor: ${messageInput ? messageInput.value : 'N/A'}<br>
            `;
        }

        function updateInputPlaceholder() {
            if (!messageInput) return;
            
            const placeholders = {
                'lia': 'Pregunta algo a LIA...',
                'users': 'Escribe un mensaje para los usuarios...'
            };
            
            messageInput.placeholder = livestreamChatState.messageType 
                ? placeholders[livestreamChatState.messageType] 
                : 'Selecciona LIA para preguntar...';
                
            // Actualizar estado del botón de envío
            if (sendBtn) {
                const hasMessage = messageInput.value.trim().length > 0;
                const hasType = livestreamChatState.messageType !== null;
                sendBtn.disabled = !hasMessage || !hasType;
                
                console.log('[TEST] Actualizando botón de envío:', {
                    hasMessage,
                    hasType,
                    disabled: sendBtn.disabled,
                    messageType: livestreamChatState.messageType
                });
            }
            
            updateDebugInfo();
        }

        function initializeMessageTypeSelector() {
            console.log('[TEST] Inicializando selector de tipo de mensaje...');
            const typeSelector = document.getElementById('messageTypeSelector');
            if (!typeSelector) {
                console.error('[TEST] Selector de tipo de mensaje no encontrado');
                return;
            }

            const typeBtns = typeSelector.querySelectorAll('.type-btn');
            console.log('[TEST] Botones encontrados:', typeBtns.length);
            
            typeBtns.forEach(btn => {
                console.log('[TEST] Configurando botón:', btn.dataset.type, 'Estado inicial:', btn.classList.contains('active'));
                console.log('[TEST] Botón HTML:', btn.outerHTML);
                
                btn.addEventListener('click', (e) => {
                    console.log('[TEST] Botón clickeado:', btn.dataset.type);
                    console.log('[TEST] Evento click recibido:', e);
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Remover clase active de todos los botones
                    typeBtns.forEach(b => {
                        b.classList.remove('active');
                        console.log('[TEST] Removiendo active de:', b.dataset.type);
                    });
                    
                    // Agregar clase active al botón clickeado
                    btn.classList.add('active');
                    console.log('[TEST] Agregando active a:', btn.dataset.type);
                    
                    // Agregar indicador visual temporal para debugging
                    btn.style.border = '2px solid red';
                    setTimeout(() => {
                        btn.style.border = '';
                    }, 1000);
                    
                    // Actualizar el estado del tipo de mensaje
                    livestreamChatState.messageType = btn.dataset.type;
                    
                    // Actualizar placeholder del input y estado del botón de envío
                    updateInputPlaceholder();
                    
                    console.log('[TEST] Tipo de mensaje cambiado a:', livestreamChatState.messageType);
                    console.log('[TEST] Estado actual del botón:', btn.classList.contains('active'));
                });
            });
            
            // No establecer tipo por defecto - el usuario debe seleccionar
            updateInputPlaceholder();
            console.log('[TEST] Selector inicializado. Estado inicial:', livestreamChatState.messageType);
        }

        function sendLivestreamMessage() {
            console.log('[TEST] Intentando enviar mensaje...');
            const message = messageInput.value.trim();
            if (!message) {
                console.log('[TEST] Mensaje vacío, no se envía');
                return;
            }

            // Verificar que se haya seleccionado un tipo de mensaje
            if (!livestreamChatState.messageType) {
                console.log('[TEST] No se ha seleccionado tipo de mensaje. Estado actual:', livestreamChatState.messageType);
                alert('Por favor selecciona LIA antes de enviar un mensaje');
                return;
            }

            console.log('[TEST] Mensaje enviado:', message, 'Tipo:', livestreamChatState.messageType);
            alert(`Mensaje enviado: "${message}" (Tipo: ${livestreamChatState.messageType})`);
            messageInput.value = '';
            updateInputPlaceholder();
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[TEST] DOM cargado, inicializando...');
            
            // Inicializar selector de tipo de mensaje
            initializeMessageTypeSelector();
            
            // Eventos de la interfaz
            if (sendBtn) {
                sendBtn.addEventListener('click', sendLivestreamMessage);
            }
            
            if (messageInput) {
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendLivestreamMessage();
                    }
                });
                
                // Agregar listener para actualizar el estado del botón cuando se escribe
                messageInput.addEventListener('input', () => {
                    updateInputPlaceholder();
                });
            }
            
            // Actualizar debug info inicial
            updateDebugInfo();
            
            console.log('[TEST] Inicialización completada');
        });
    </script>
</body>
</html>
