<!DOCTYPE html>
<html>
<head>
    <title>Diagnóstico CORS - aprendeyaplica.ai</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
        button { margin: 5px; padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>🔍 Diagnóstico CORS - aprendeyaplica.ai</h1>

    <div class="test-result info">
        <strong>Dominio actual:</strong> <span id="current-domain"></span><br>
        <strong>Protocolo:</strong> <span id="current-protocol"></span><br>
        <strong>URL completa:</strong> <span id="current-url"></span>
    </div>

    <h2>Pruebas CORS</h2>

    <button onclick="testDebugCors()">🔍 Probar API Debug CORS</button>
    <button onclick="testLogin()">🔐 Probar API Login</button>
    <button onclick="clearResults()">🧹 Limpiar Resultados</button>

    <div id="results"></div>

    <script>
        // Mostrar información del dominio actual
        document.getElementById('current-domain').textContent = window.location.hostname;
        document.getElementById('current-protocol').textContent = window.location.protocol;
        document.getElementById('current-url').textContent = window.location.href;

        function addResult(title, content, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `
                <strong>${title}</strong>
                <pre>${typeof content === 'object' ? JSON.stringify(content, null, 2) : content}</pre>
            `;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDebugCors() {
            addResult('🔍 Iniciando prueba Debug CORS...', 'Enviando solicitud a /api/debug-cors');

            try {
                const response = await fetch('/api/debug-cors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': window.location.origin
                    },
                    body: JSON.stringify({ test: 'debug-cors' })
                });

                const responseText = await response.text();

                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        addResult(`✅ Debug CORS - Respuesta (${response.status})`, data, 'success');
                    } catch {
                        addResult(`✅ Debug CORS - Respuesta (${response.status})`, responseText, 'success');
                    }
                } else {
                    addResult(`❌ Debug CORS - Error (${response.status})`, responseText, 'error');
                }
            } catch (error) {
                addResult('❌ Debug CORS - Error de conexión', error.message, 'error');
            }
        }

        async function testLogin() {
            addResult('🔐 Iniciando prueba Login...', 'Enviando solicitud a /api/login');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Origin': window.location.origin
                    },
                    body: JSON.stringify({
                        username: 'test@example.com',
                        password: 'testpassword'
                    })
                });

                const responseText = await response.text();

                if (response.status === 403) {
                    addResult(`❌ Login - Error CORS (${response.status})`, responseText, 'error');
                } else if (response.status === 401) {
                    addResult(`✅ Login - CORS OK, credenciales incorrectas (${response.status})`, responseText, 'success');
                } else {
                    try {
                        const data = JSON.parse(responseText);
                        addResult(`✅ Login - Respuesta (${response.status})`, data, 'success');
                    } catch {
                        addResult(`✅ Login - Respuesta (${response.status})`, responseText, 'success');
                    }
                }
            } catch (error) {
                addResult('❌ Login - Error de conexión', error.message, 'error');
            }
        }

        // Ejecutar una prueba automática al cargar
        window.addEventListener('load', () => {
            setTimeout(testDebugCors, 1000);
        });
    </script>
</body>
</html>
