<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Debug Storage Issues</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        .debug-section {
            background: #2d2d2d;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border-left: 4px solid #007bff;
        }
        .success { border-left-color: #28a745; }
        .error { border-left-color: #dc3545; }
        .warning { border-left-color: #ffc107; }
        .info { border-left-color: #17a2b8; }

        .debug-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-family: inherit;
        }
        .debug-btn:hover {
            background: #0056b3;
        }
        .log-entry {
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
        }
        .log-success { background: #1e5f3e; }
        .log-error { background: #5f1e1e; }
        .log-warning { background: #5f4e1e; }
        .log-info { background: #1e3a5f; }

        .json-display {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 11px;
        }

        .file-input {
            background: #3d3d3d;
            color: white;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug Storage Issues - Community Thinks</h1>
    <p>Herramienta de diagnóstico completo para el sistema de storage</p>

    <div class="debug-section">
        <h3>🔧 Controles de Diagnóstico</h3>
        <button class="debug-btn" onclick="checkSupabaseConnection()">1. Verificar Conexión Supabase</button>
        <button class="debug-btn" onclick="checkAuthentication()">2. Verificar Autenticación</button>
        <button class="debug-btn" onclick="listAllBuckets()">3. Listar Buckets</button>
        <button class="debug-btn" onclick="checkBucketPolicies()">4. Verificar Políticas</button>
        <button class="debug-btn" onclick="testFileUpload()">5. Test Upload</button>
        <button class="debug-btn" onclick="clearLogs()">🗑️ Limpiar Logs</button>
    </div>

    <div class="debug-section">
        <h3>📄 Test de Subida Manual</h3>
        <input type="file" id="testFileInput" class="file-input" accept="*/*">
        <button class="debug-btn" onclick="manualUploadTest()">Subir Archivo de Prueba</button>
    </div>

    <div class="debug-section">
        <h3>📊 Logs de Diagnóstico</h3>
        <div id="debugLogs"></div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../src/scripts/supabase-client.js"></script>

    <script>
        // Sistema de logs
        function log(message, type = 'info', data = null) {
            const logsContainer = document.getElementById('debugLogs');
            const timestamp = new Date().toLocaleTimeString();

            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;

            let content = `[${timestamp}] ${message}`;
            if (data) {
                content += '\n' + JSON.stringify(data, null, 2);
            }

            logEntry.textContent = content;
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);

            console.log(`[DEBUG] ${message}`, data || '');
        }

        function clearLogs() {
            document.getElementById('debugLogs').innerHTML = '';
        }

        // 1. Verificar conexión a Supabase
        async function checkSupabaseConnection() {
            log('🔍 Verificando conexión a Supabase...', 'info');

            try {
                if (!window.supabase) {
                    throw new Error('window.supabase no está disponible');
                }

                log('✅ Cliente Supabase cargado correctamente', 'success');

                // Test básico de conexión
                const { data, error } = await window.supabase.auth.getSession();

                if (error) {
                    log('❌ Error obteniendo sesión', 'error', error);
                    return false;
                } else {
                    log('✅ Conexión a Supabase Auth exitosa', 'success');
                    return true;
                }

            } catch (error) {
                log('❌ Error de conexión Supabase', 'error', error);
                return false;
            }
        }

        // 2. Verificar autenticación
        async function checkAuthentication() {
            log('🔐 Verificando estado de autenticación...', 'info');

            try {
                const { data: { session }, error } = await window.supabase.auth.getSession();

                if (error) {
                    log('❌ Error verificando sesión', 'error', error);
                    return null;
                }

                if (!session) {
                    log('⚠️ Usuario no autenticado', 'warning');
                    log('💡 Hint: Inicia sesión primero en el sistema', 'info');
                    return null;
                }

                log('✅ Usuario autenticado', 'success', {
                    email: session.user.email,
                    user_id: session.user.id,
                    expires_at: new Date(session.expires_at * 1000).toLocaleString()
                });

                // Verificar el token
                log('🔑 Verificando token JWT...', 'info');
                const token = session.access_token;
                if (token && token.length > 100) {
                    log('✅ Token JWT válido (longitud apropiada)', 'success');
                } else {
                    log('⚠️ Token JWT puede tener problemas', 'warning', { tokenLength: token?.length });
                }

                return session;

            } catch (error) {
                log('❌ Error verificando autenticación', 'error', error);
                return null;
            }
        }

        // 3. Listar todos los buckets
        async function listAllBuckets() {
            log('📂 Listando buckets disponibles...', 'info');

            try {
                const { data: buckets, error } = await window.supabase.storage.listBuckets();

                if (error) {
                    log('❌ Error listando buckets', 'error', error);
                    return;
                }

                if (!buckets || buckets.length === 0) {
                    log('⚠️ No se encontraron buckets', 'warning');
                    return;
                }

                log(`✅ Encontrados ${buckets.length} buckets`, 'success');

                // Verificar si community-thinks existe
                const communityBucket = buckets.find(b => b.name === 'community-thinks');
                if (communityBucket) {
                    log('✅ Bucket "community-thinks" encontrado', 'success', communityBucket);

                    // Intentar listar archivos en el bucket
                    try {
                        const { data: files, error: filesError } = await window.supabase.storage
                            .from('community-thinks')
                            .list('', { limit: 10 });

                        if (filesError) {
                            log('❌ Error listando archivos del bucket', 'error', filesError);
                        } else {
                            log(`📁 Bucket tiene ${files.length} archivos`, 'info', files);
                        }
                    } catch (listError) {
                        log('❌ Error accediendo al contenido del bucket', 'error', listError);
                    }
                } else {
                    log('❌ Bucket "community-thinks" NO ENCONTRADO', 'error');
                    log('💡 Buckets disponibles:', 'info', buckets.map(b => b.name));
                }

            } catch (error) {
                log('❌ Error en listAllBuckets', 'error', error);
            }
        }

        // 4. Verificar políticas RLS
        async function checkBucketPolicies() {
            log('🛡️ Verificando políticas RLS...', 'info');

            try {
                // Intentar una operación que requiere políticas
                const testFile = new File(['test content'], 'policy-test.txt', { type: 'text/plain' });
                const testFileName = `policy-test-${Date.now()}.txt`;

                log('🧪 Intentando subida de prueba para verificar políticas...', 'info');

                const { data, error } = await window.supabase.storage
                    .from('community-thinks')
                    .upload(testFileName, testFile, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (error) {
                    if (error.message.includes('row-level security policy')) {
                        log('❌ Error RLS: Políticas de seguridad no configuradas', 'error', error);
                        log('💡 Solución: Ejecutar setup-community-storage-policies.sql', 'info');
                    } else if (error.message.includes('not found')) {
                        log('❌ Bucket no encontrado', 'error', error);
                    } else {
                        log('❌ Error desconocido en políticas', 'error', error);
                    }
                } else {
                    log('✅ Políticas RLS funcionando correctamente', 'success');
                    log('🧹 Limpiando archivo de prueba...', 'info');

                    // Limpiar archivo de prueba
                    try {
                        await window.supabase.storage
                            .from('community-thinks')
                            .remove([testFileName]);
                        log('✅ Archivo de prueba eliminado', 'success');
                    } catch (cleanError) {
                        log('⚠️ No se pudo eliminar archivo de prueba', 'warning', cleanError);
                    }
                }

            } catch (error) {
                log('❌ Error verificando políticas', 'error', error);
            }
        }

        // 5. Test completo de subida
        async function testFileUpload() {
            log('🚀 Iniciando test completo de subida...', 'info');

            // Crear archivo de prueba
            const testContent = `Test file created at ${new Date().toISOString()}\nThis file tests the complete upload flow.`;
            const testFile = new File([testContent], 'complete-test.txt', { type: 'text/plain' });

            try {
                // Usar la función exacta del community-view.html
                const result = await uploadFileToStorageDebug(testFile, 'test/');

                log('✅ Test de subida EXITOSO', 'success', result);

                // Verificar que la URL es accesible
                try {
                    const response = await fetch(result.url);
                    if (response.ok) {
                        log('✅ URL pública accesible', 'success');
                    } else {
                        log('⚠️ URL pública no accesible', 'warning', { status: response.status });
                    }
                } catch (fetchError) {
                    log('⚠️ Error verificando URL pública', 'warning', fetchError);
                }

            } catch (error) {
                log('❌ Test de subida FALLÓ', 'error', error);
            }
        }

        // Función de upload para debugging (copia de community-view.html)
        async function uploadFileToStorageDebug(file, folder = '') {
            log(`📤 [DEBUG] Iniciando subida: ${file.name}`, 'info');

            try {
                // Verificar Supabase
                if (!window.supabase) {
                    throw new Error('Supabase client no está disponible');
                }
                log('✅ [DEBUG] Supabase client OK', 'success');

                // Verificar autenticación
                const { data: { session }, error: authError } = await window.supabase.auth.getSession();

                if (authError) {
                    log('❌ [DEBUG] Error de autenticación', 'error', authError);
                    throw new Error(`Error de autenticación: ${authError.message}`);
                }

                if (!session) {
                    log('❌ [DEBUG] No hay sesión activa', 'error');
                    throw new Error('Debes estar autenticado para subir archivos');
                }

                log('✅ [DEBUG] Sesión válida', 'success', { user: session.user.email });

                // Generar nombre único
                const timestamp = Date.now();
                const randomId = Math.random().toString(36).substring(2, 15);
                const fileExtension = file.name.split('.').pop();
                const fileName = `${folder}${timestamp}_${randomId}.${fileExtension}`;

                log(`📝 [DEBUG] Nombre generado: ${fileName}`, 'info');

                // Intentar subida
                log('🔄 [DEBUG] Iniciando upload...', 'info');

                const { data, error } = await window.supabase.storage
                    .from('community-thinks')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (error) {
                    log('❌ [DEBUG] Error en upload', 'error', {
                        message: error.message,
                        details: error,
                        fileName: fileName,
                        fileSize: file.size,
                        fileType: file.type
                    });
                    throw error;
                }

                log('✅ [DEBUG] Upload exitoso', 'success', data);

                // Obtener URL pública
                const { data: urlData } = window.supabase.storage
                    .from('community-thinks')
                    .getPublicUrl(fileName);

                log('✅ [DEBUG] URL generada', 'success', urlData);

                return {
                    url: urlData.publicUrl,
                    path: fileName
                };

            } catch (error) {
                log('❌ [DEBUG] Error completo', 'error', error);
                throw error;
            }
        }

        // Test manual de subida
        async function manualUploadTest() {
            const fileInput = document.getElementById('testFileInput');
            const file = fileInput.files[0];

            if (!file) {
                log('⚠️ Selecciona un archivo primero', 'warning');
                return;
            }

            log(`🎯 Test manual con archivo: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, 'info');

            try {
                const result = await uploadFileToStorageDebug(file, 'manual-test/');
                log('🎉 Test manual EXITOSO', 'success', result);
            } catch (error) {
                log('💥 Test manual FALLÓ', 'error', error);
            }
        }

        // Autorun inicial
        window.addEventListener('load', async () => {
            log('🚀 Iniciando diagnóstico automático...', 'info');

            await new Promise(resolve => setTimeout(resolve, 1000)); // Esperar carga

            await checkSupabaseConnection();
            await checkAuthentication();
            await listAllBuckets();

            log('📋 Diagnóstico automático completado', 'info');
            log('💡 Usa los botones para tests específicos', 'info');
        });
    </script>
</body>
</html>
