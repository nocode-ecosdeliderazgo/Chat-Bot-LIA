<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test LIA Button Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        
        .message-type-selector {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(68, 229, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(68, 229, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .type-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 8px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: #888;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .type-btn:hover {
            background: rgba(68, 229, 255, 0.1);
            color: white;
        }
        
        .type-btn.active {
            background: #44e5ff;
            color: #1a1a1a;
            border-color: #44e5ff;
            box-shadow: 0 2px 8px rgba(68, 229, 255, 0.3);
        }
        
        .debug-info {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
        }
        
        .test-buttons {
            margin: 20px 0;
        }
        
        .test-buttons button {
            margin: 5px;
            padding: 10px;
            background: #44e5ff;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Test LIA Button Simple</h2>
        
        <div class="message-type-selector" id="messageTypeSelector">
            <button class="type-btn" data-type="lia" title="Enviar a LIA (Chatbot)">
                <span>🧠</span>
                <span>LIA</span>
            </button>
        </div>
        
        <div class="test-buttons">
            <button onclick="testClick()">Test Click Manual</button>
            <button onclick="testDispatchEvent()">Test DispatchEvent</button>
            <button onclick="checkElement()">Check Element</button>
        </div>
        
        <div class="debug-info" id="debugInfo">
            Estado inicial...
        </div>
    </div>

    <script>
        let messageType = null;
        
        function updateDebugInfo() {
            const debugInfo = document.getElementById('debugInfo');
            const liaBtn = document.querySelector('[data-type="lia"]');
            
            debugInfo.innerHTML = `
                <strong>Estado:</strong><br>
                messageType: ${messageType}<br>
                botón existe: ${!!liaBtn}<br>
                tiene clase active: ${liaBtn?.classList.contains('active')}<br>
                <br>
                <strong>HTML del botón:</strong><br>
                ${liaBtn ? liaBtn.outerHTML : 'No encontrado'}<br>
                <br>
                <strong>Event Listeners:</strong><br>
                onclick: ${liaBtn?.onclick ? 'Sí' : 'No'}<br>
            `;
        }
        
        function initializeButton() {
            console.log('[SIMPLE] Inicializando botón...');
            const liaBtn = document.querySelector('[data-type="lia"]');
            
            if (liaBtn) {
                console.log('[SIMPLE] Botón encontrado, agregando event listener...');
                
                liaBtn.addEventListener('click', (e) => {
                    console.log('[SIMPLE] ¡CLICK DETECTADO!');
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Toggle active state
                    liaBtn.classList.toggle('active');
                    messageType = liaBtn.classList.contains('active') ? 'lia' : null;
                    
                    // Visual feedback
                    liaBtn.style.border = '2px solid red';
                    setTimeout(() => {
                        liaBtn.style.border = '';
                    }, 1000);
                    
                    console.log('[SIMPLE] Estado actualizado:', messageType);
                    updateDebugInfo();
                });
                
                console.log('[SIMPLE] Event listener agregado');
            } else {
                console.error('[SIMPLE] Botón no encontrado');
            }
            
            updateDebugInfo();
        }
        
        function testClick() {
            console.log('[SIMPLE] Test: Click manual');
            const liaBtn = document.querySelector('[data-type="lia"]');
            if (liaBtn) {
                liaBtn.click();
            }
        }
        
        function testDispatchEvent() {
            console.log('[SIMPLE] Test: DispatchEvent');
            const liaBtn = document.querySelector('[data-type="lia"]');
            if (liaBtn) {
                const event = new Event('click', { bubbles: true, cancelable: true });
                liaBtn.dispatchEvent(event);
            }
        }
        
        function checkElement() {
            console.log('[SIMPLE] Check: Verificando elemento');
            const liaBtn = document.querySelector('[data-type="lia"]');
            if (liaBtn) {
                const rect = liaBtn.getBoundingClientRect();
                const style = window.getComputedStyle(liaBtn);
                
                console.log('[SIMPLE] Posición:', rect);
                console.log('[SIMPLE] Estilos:', {
                    display: style.display,
                    visibility: style.visibility,
                    opacity: style.opacity,
                    pointerEvents: style.pointerEvents
                });
                console.log('[SIMPLE] Elementos en posición:', document.elementsFromPoint(rect.left + rect.width/2, rect.top + rect.height/2));
            }
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[SIMPLE] DOM cargado, inicializando...');
            initializeButton();
        });
    </script>
</body>
</html>
