[build]
  base = "."
  publish = "src"
  node_version = "18"
  
[build.environment]
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"

# Specific API redirects (higher priority than wildcards)
[[redirects]]
  from = "/api/user/session"
  to   = "/.netlify/functions/get-user-session"
  status = 200

[[redirects]]
  from = "/api/login"
  to   = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/auth/issue"
  to   = "/.netlify/functions/auth-issue"
  status = 200

[[redirects]]
  from = "/api/register"
  to   = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/openai"
  to   = "/.netlify/functions/openai"
  status = 200

# Grafana redirects
[[redirects]]
  from = "/grafana/health"
  to   = "/.netlify/functions/grafana-health"
  status = 200

[[redirects]]
  from = "/grafana/panel/*.png"
  to   = "/.netlify/functions/grafana-panel"
  status = 200

# API Statistics redirects
[[redirects]]
  from = "/api/genai-radar/*"
  to   = "/.netlify/functions/genai-radar"
  status = 200

[[redirects]]
  from = "/api/adopcion-genai"
  to   = "/.netlify/functions/adopcion-genai"
  status = 200

# User profile redirects
[[redirects]]
  from = "/api/update-avatar"
  to   = "/.netlify/functions/update-avatar"
  status = 200

# Course Progress API redirects (Legacy - mantener para compatibilidad)
[[redirects]]
  from = "/api/course-progress"
  to   = "/.netlify/functions/get-course-progress"
  status = 200

[[redirects]]
  from = "/api/module-progress"
  to   = "/.netlify/functions/update-module-progress"
  status = 200

[[redirects]]
  from = "/api/video-progress"
  to   = "/.netlify/functions/update-video-progress"
  status = 200

# Dynamic Course System API redirects (NEW - rutas corregidas)
[[redirects]]
  from = "/api/courses/*/full-structure"
  to   = "/.netlify/functions/course-data"
  status = 200

[[redirects]]
  from = "/api/courses/*/current-module/*"
  to   = "/.netlify/functions/course-data"
  status = 200

[[redirects]]
  from = "/api/modules/*/video-data"
  to   = "/.netlify/functions/course-data"
  status = 200

[[redirects]]
  from = "/api/modules/*/videos"
  to   = "/.netlify/functions/course-data"
  status = 200

[[redirects]]
  from = "/api/users/*/progress/*"
  to   = "/.netlify/functions/user-progress"
  status = 200

[[redirects]]
  from = "/api/users/*/video-progress"
  to   = "/.netlify/functions/user-progress"
  status = 200

[[redirects]]
  from = "/api/users/*/switch-module"
  to   = "/.netlify/functions/user-progress"
  status = 200

[[redirects]]
  from = "/api/users/*/switch-video"
  to   = "/.netlify/functions/user-progress"
  status = 200

# Module 1 Videos API redirects (NEW)
[[redirects]]
  from = "/api/courses/module1-videos"
  to   = "/.netlify/functions/courses"
  status = 200

[[redirects]]
  from = "/api/courses/module1-info"
  to   = "/.netlify/functions/courses"
  status = 200

# Wildcard redirect (must be last)
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200


