[build]
  publish = "public"
  command = "cp -r src/* public/ 2>/dev/null || mkdir -p public && cp -r src/* public/"
  node_version = "18.18.0"
  
[build.environment]
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"

# Specific API redirects
[[redirects]]
  from = "/api/user/session"
  to   = "/.netlify/functions/get-user-session"
  status = 200

[[redirects]]
  from = "/api/login"
  to   = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/auth/issue"
  to   = "/.netlify/functions/auth-issue"
  status = 200

[[redirects]]
  from = "/api/register"
  to   = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/openai"
  to   = "/.netlify/functions/openai"
  status = 200

[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200


