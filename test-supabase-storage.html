<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Storage Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .info { background: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; white-space: pre-wrap; }
        input[type="file"] { margin: 10px 0; }
        #log { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔍 Test de Supabase Storage Debug</h1>
    
    <div class="test-section">
        <h2>1. Verificar Configuración</h2>
        <button class="btn-primary" onclick="testConfig()">Verificar Config</button>
        <div id="configResult"></div>
    </div>

    <div class="test-section">
        <h2>2. Test de Autenticación</h2>
        <button class="btn-primary" onclick="testAuth()">Test Auth</button>
        <div id="authResult"></div>
    </div>

    <div class="test-section">
        <h2>3. Test de Buckets</h2>
        <button class="btn-primary" onclick="testBuckets()">Listar Buckets</button>
        <button class="btn-primary" onclick="createAvatarsBucket()">Crear AVATARS Bucket</button>
        <div id="bucketsResult"></div>
    </div>

    <div class="test-section">
        <h2>4. Test de Upload</h2>
        <input type="file" id="testFile" accept="image/*">
        <button class="btn-primary" onclick="testUpload()">Test Upload</button>
        <div id="uploadResult"></div>
    </div>

    <div class="test-section">
        <h2>5. Log de Debugging</h2>
        <button class="btn-danger" onclick="clearLog()">Clear Log</button>
        <pre id="log"></pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" type="module"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        
        let supabase = null;
        let currentUser = null;
        
        // Función de logging
        window.log = function(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            logDiv.textContent += logEntry;
            logDiv.scrollTop = logDiv.scrollHeight;
            
            if (type === 'error') {
                console.error(message);
            } else {
                console.log(message);
            }
        };

        window.clearLog = function() {
            document.getElementById('log').textContent = '';
        };

        // 1. Test de configuración
        window.testConfig = async function() {
            const resultDiv = document.getElementById('configResult');
            resultDiv.innerHTML = '<p>Verificando configuración...</p>';
            
            try {
                // Obtener credenciales desde localStorage o meta tags
                const supabaseUrl = localStorage.getItem('supabaseUrl') || 
                                   document.querySelector('meta[name="supabase-url"]')?.content;
                const supabaseKey = localStorage.getItem('supabaseAnonKey') || 
                                   localStorage.getItem('supabaseKey') ||
                                   document.querySelector('meta[name="supabase-key"]')?.content;
                
                log(`Supabase URL: ${supabaseUrl ? 'ENCONTRADA' : 'NO ENCONTRADA'}`);
                log(`Supabase Key: ${supabaseKey ? 'ENCONTRADA (longitud: ' + supabaseKey.length + ')' : 'NO ENCONTRADA'}`);
                
                if (!supabaseUrl || !supabaseKey) {
                    resultDiv.innerHTML = '<div class="error"><h3>❌ Error de Configuración</h3><p>Credenciales de Supabase no encontradas. Verifica localStorage o meta tags.</p></div>';
                    return;
                }
                
                // Inicializar Supabase
                supabase = createClient(supabaseUrl, supabaseKey);
                log('Supabase client inicializado');
                
                // Cargar usuario actual
                const userRaw = localStorage.getItem('currentUser');
                if (userRaw) {
                    currentUser = JSON.parse(userRaw);
                    log(`Usuario actual: ${currentUser.username || currentUser.email || 'sin identificar'}`);
                } else {
                    log('No hay usuario en localStorage', 'warn');
                }
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ Configuración OK</h3>
                        <p><strong>URL:</strong> ${supabaseUrl}</p>
                        <p><strong>Key:</strong> ${supabaseKey.substring(0, 20)}...</p>
                        <p><strong>Usuario:</strong> ${currentUser?.username || 'No cargado'}</p>
                    </div>
                `;
                
            } catch (error) {
                log(`Error en configuración: ${error.message}`, 'error');
                resultDiv.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${error.message}</p></div>`;
            }
        };

        // 2. Test de autenticación
        window.testAuth = async function() {
            const resultDiv = document.getElementById('authResult');
            resultDiv.innerHTML = '<p>Verificando autenticación...</p>';
            
            if (!supabase) {
                resultDiv.innerHTML = '<div class="error"><p>Primero ejecuta "Verificar Config"</p></div>';
                return;
            }
            
            try {
                // Verificar sesión actual
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError) {
                    log(`Error obteniendo sesión: ${sessionError.message}`, 'error');
                } else if (session && session.user) {
                    log(`✅ Usuario autenticado: ${session.user.email}`);
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Usuario Autenticado</h3>
                            <p><strong>Email:</strong> ${session.user.email}</p>
                            <p><strong>ID:</strong> ${session.user.id}</p>
                            <p><strong>Confirmado:</strong> ${session.user.email_confirmed_at ? 'Sí' : 'No'}</p>
                        </div>
                    `;
                    return;
                } else {
                    log('No hay sesión activa, intentando autenticar...', 'warn');
                }
                
                // Intentar autenticar con datos locales
                if (currentUser?.email) {
                    log(`Intentando login con email: ${currentUser.email}`);
                    
                    // Intentar diferentes passwords comunes
                    const passwords = [
                        currentUser.password,
                        'defaultPassword123!',
                        'TempPassword123!',
                        '123456789',
                        'password123'
                    ].filter(p => p); // Filtrar undefined/null
                    
                    let loginSuccess = false;
                    
                    for (const password of passwords) {
                        try {
                            log(`Probando contraseña...`);
                            const { data, error } = await supabase.auth.signInWithPassword({
                                email: currentUser.email,
                                password: password
                            });
                            
                            if (!error && data.session) {
                                log(`✅ Login exitoso con password`);
                                loginSuccess = true;
                                resultDiv.innerHTML = `
                                    <div class="success">
                                        <h3>✅ Login Exitoso</h3>
                                        <p><strong>Email:</strong> ${data.session.user.email}</p>
                                        <p><strong>Método:</strong> Password existente</p>
                                    </div>
                                `;
                                break;
                            } else if (error) {
                                log(`Password falló: ${error.message}`);
                            }
                        } catch (e) {
                            log(`Error en login: ${e.message}`);
                        }
                    }
                    
                    if (!loginSuccess) {
                        // Intentar crear usuario
                        log('Intentando crear nuevo usuario...');
                        const { data, error } = await supabase.auth.signUp({
                            email: currentUser.email,
                            password: 'TempPassword123!',
                            options: {
                                data: {
                                    username: currentUser.username,
                                    full_name: currentUser.full_name || currentUser.username
                                }
                            }
                        });
                        
                        if (!error && data.user) {
                            if (data.session) {
                                log('✅ Usuario creado y autenticado');
                                resultDiv.innerHTML = `
                                    <div class="success">
                                        <h3>✅ Usuario Creado</h3>
                                        <p><strong>Email:</strong> ${data.user.email}</p>
                                        <p><strong>Estado:</strong> Autenticado</p>
                                    </div>
                                `;
                            } else {
                                log('Usuario creado pero necesita confirmar email', 'warn');
                                resultDiv.innerHTML = `
                                    <div class="info">
                                        <h3>📧 Confirmación Requerida</h3>
                                        <p>Usuario creado pero necesita confirmar email para usar Storage</p>
                                        <p><strong>Email:</strong> ${data.user.email}</p>
                                    </div>
                                `;
                            }
                        } else {
                            log(`Error creando usuario: ${error?.message}`, 'error');
                            resultDiv.innerHTML = `<div class="error"><h3>❌ Error Auth</h3><p>${error?.message || 'No se pudo autenticar'}</p></div>`;
                        }
                    }
                } else {
                    resultDiv.innerHTML = '<div class="error"><p>No hay email para autenticar</p></div>';
                }
                
            } catch (error) {
                log(`Error en test auth: ${error.message}`, 'error');
                resultDiv.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${error.message}</p></div>`;
            }
        };

        // 3. Test de buckets
        window.testBuckets = async function() {
            const resultDiv = document.getElementById('bucketsResult');
            resultDiv.innerHTML = '<p>Listando buckets...</p>';
            
            if (!supabase) {
                resultDiv.innerHTML = '<div class="error"><p>Primero ejecuta "Verificar Config"</p></div>';
                return;
            }
            
            try {
                const { data: buckets, error } = await supabase.storage.listBuckets();
                
                if (error) {
                    log(`Error listando buckets: ${error.message}`, 'error');
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${error.message}</p></div>`;
                    return;
                }
                
                log(`Buckets encontrados: ${buckets.length}`);
                const hasAvatars = buckets.some(b => b.name === 'AVATARS' || b.name === 'avatars');
                
                let html = `<div class="${hasAvatars ? 'success' : 'info'}"><h3>📁 Buckets Disponibles (${buckets.length})</h3><ul>`;
                buckets.forEach(bucket => {
                    html += `<li><strong>${bucket.name}</strong> - ${bucket.public ? 'Público' : 'Privado'}</li>`;
                });
                html += '</ul>';
                
                if (!hasAvatars) {
                    html += '<p><strong>⚠️ Bucket "AVATARS" no encontrado</strong></p>';
                }
                
                html += '</div>';
                resultDiv.innerHTML = html;
                
            } catch (error) {
                log(`Error en test buckets: ${error.message}`, 'error');
                resultDiv.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${error.message}</p></div>`;
            }
        };

        // 4. Crear bucket AVATARS
        window.createAvatarsBucket = async function() {
            const resultDiv = document.getElementById('bucketsResult');
            
            if (!supabase) {
                alert('Primero ejecuta "Verificar Config"');
                return;
            }
            
            try {
                log('Creando bucket AVATARS...');
                const { data, error } = await supabase.storage.createBucket('AVATARS', {
                    public: true,
                    allowedMimeTypes: ['image/png', 'image/jpeg', 'image/jpg', 'image/gif', 'image/webp'],
                    fileSizeLimit: 5242880 // 5MB
                });
                
                if (error) {
                    log(`Error creando bucket: ${error.message}`, 'error');
                    alert(`Error: ${error.message}`);
                } else {
                    log('✅ Bucket AVATARS creado exitosamente');
                    alert('Bucket AVATARS creado exitosamente');
                    // Actualizar lista
                    testBuckets();
                }
                
            } catch (error) {
                log(`Error creando bucket: ${error.message}`, 'error');
                alert(`Error: ${error.message}`);
            }
        };

        // 5. Test de upload
        window.testUpload = async function() {
            const resultDiv = document.getElementById('uploadResult');
            const fileInput = document.getElementById('testFile');
            
            if (!fileInput.files[0]) {
                alert('Selecciona un archivo primero');
                return;
            }
            
            if (!supabase) {
                alert('Primero ejecuta "Verificar Config" y "Test Auth"');
                return;
            }
            
            const file = fileInput.files[0];
            resultDiv.innerHTML = '<p>Subiendo archivo...</p>';
            
            try {
                log(`Iniciando upload: ${file.name} (${file.size} bytes)`);
                
                // Verificar sesión antes del upload
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    log('No hay sesión activa para upload', 'error');
                    resultDiv.innerHTML = '<div class="error"><h3>❌ Error</h3><p>No hay sesión activa. Ejecuta "Test Auth" primero.</p></div>';
                    return;
                }
                
                const fileName = `test_${Date.now()}_${file.name}`;
                log(`Nombre del archivo: ${fileName}`);
                
                const { data, error } = await supabase.storage
                    .from('AVATARS')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: true
                    });
                
                if (error) {
                    log(`❌ Error en upload: ${error.message}`, 'error');
                    resultDiv.innerHTML = `<div class="error"><h3>❌ Upload Falló</h3><p><strong>Error:</strong> ${error.message}</p><p><strong>Archivo:</strong> ${file.name}</p></div>`;
                    return;
                }
                
                log(`✅ Upload exitoso: ${data.path}`);
                
                // Obtener URL pública
                const { data: urlData } = supabase.storage
                    .from('AVATARS')
                    .getPublicUrl(fileName);
                
                if (urlData?.publicUrl) {
                    log(`URL pública: ${urlData.publicUrl}`);
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Upload Exitoso</h3>
                            <p><strong>Archivo:</strong> ${file.name}</p>
                            <p><strong>Path:</strong> ${data.path}</p>
                            <p><strong>URL:</strong> <a href="${urlData.publicUrl}" target="_blank">${urlData.publicUrl}</a></p>
                            <img src="${urlData.publicUrl}" style="max-width: 200px; margin-top: 10px;" alt="Uploaded image">
                        </div>
                    `;
                } else {
                    log('No se pudo obtener URL pública', 'warn');
                    resultDiv.innerHTML = `<div class="info"><h3>⚠️ Upload OK pero sin URL</h3><p>Archivo subido pero no se pudo generar URL pública</p></div>`;
                }
                
            } catch (error) {
                log(`Error en test upload: ${error.message}`, 'error');
                resultDiv.innerHTML = `<div class="error"><h3>❌ Error</h3><p>${error.message}</p></div>`;
            }
        };

        // Auto-inicializar configuración al cargar
        window.addEventListener('load', () => {
            log('🚀 Test de Supabase Storage iniciado');
            testConfig();
        });
    </script>
</body>
</html>
