<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Selector de Tipo de Mensaje</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .type-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 5px;
        }
        
        .type-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .type-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .livestream-chat-input {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        
        .message-input-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        #livestreamMessageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        #livestreamMessageInput::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        #livestreamMessageInput:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .livestream-send-btn {
            padding: 12px 16px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        .livestream-send-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <h1>🧪 Test - Selector de Tipo de Mensaje</h1>
    <p>Esta es una versión simplificada para probar el selector de tipo de mensaje.</p>
    
    <div class="livestream-chat-input">
        <div class="message-type-selector" id="messageTypeSelector">
            <div class="type-selector-label">Selecciona el tipo de mensaje:</div>
            <button class="type-btn" data-type="live" title="Enviar al chat en vivo">
                <i class='bx bx-message'></i>
                <span>Chat en Vivo</span>
            </button>
            <button class="type-btn" data-type="lia" title="Enviar a LIA (Chatbot)">
                <i class='bx bx-brain'></i>
                <span>LIA</span>
            </button>
        </div>
        
        <div class="message-input-container">
            <input 
                type="text" 
                id="livestreamMessageInput" 
                placeholder="Selecciona el tipo de mensaje arriba para comenzar..."
                maxlength="200"
                disabled
            >
            <button id="livestreamSendBtn" class="livestream-send-btn" disabled title="Enviar mensaje">
                <i class='bx bx-send'></i>
            </button>
        </div>
    </div>
    
    <div class="debug-info">
        <h3>🔍 Debug Info</h3>
        <p><strong>Tipo seleccionado:</strong> <span id="selectedType">Ninguno</span></p>
        <p><strong>Input habilitado:</strong> <span id="inputEnabled">No</span></p>
        <p><strong>Botón habilitado:</strong> <span id="buttonEnabled">No</span></p>
    </div>

    <script>
        // Elementos del DOM
        const liaMessageInput = document.getElementById('livestreamMessageInput');
        const liaSendBtn = document.getElementById('livestreamSendBtn');
        const typeBtns = document.querySelectorAll('.type-btn');
        
        // Debug elements
        const selectedTypeSpan = document.getElementById('selectedType');
        const inputEnabledSpan = document.getElementById('inputEnabled');
        const buttonEnabledSpan = document.getElementById('buttonEnabled');
        
        console.log('🧪 Iniciando test del selector de tipo de mensaje');
        
        // Función para obtener el tipo de mensaje seleccionado
        function getSelectedMessageType() {
            const activeTypeBtn = document.querySelector('.type-btn.active');
            return activeTypeBtn ? activeTypeBtn.dataset.type : null;
        }
        
        // Función para actualizar debug info
        function updateDebugInfo() {
            const selectedType = getSelectedMessageType();
            selectedTypeSpan.textContent = selectedType || 'Ninguno';
            inputEnabledSpan.textContent = liaMessageInput.disabled ? 'No' : 'Sí';
            buttonEnabledSpan.textContent = liaSendBtn.disabled ? 'No' : 'Sí';
        }
        
        // Event listeners para los botones de tipo de mensaje
        typeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                console.log('🎯 Botón clickeado:', this.dataset.type);
                
                // Remover clase active de todos los botones
                typeBtns.forEach(b => b.classList.remove('active'));
                // Agregar clase active al botón clickeado
                this.classList.add('active');
                
                // Habilitar input y botón
                liaMessageInput.disabled = false;
                liaSendBtn.disabled = false;
                
                // Actualizar placeholder del input
                const messageType = this.dataset.type;
                if (messageType === 'lia') {
                    liaMessageInput.placeholder = 'Escribe tu mensaje para LIA...';
                } else if (messageType === 'live') {
                    liaMessageInput.placeholder = 'Escribe tu mensaje para el chat en vivo...';
                }
                
                console.log('✅ Tipo seleccionado:', messageType);
                console.log('✅ Input habilitado:', !liaMessageInput.disabled);
                console.log('✅ Botón habilitado:', !liaSendBtn.disabled);
                
                updateDebugInfo();
            });
        });
        
        // Event listener para el botón de envío
        liaSendBtn.addEventListener('click', function() {
            const selectedType = getSelectedMessageType();
            const message = liaMessageInput.value.trim();
            
            if (!selectedType) {
                alert('Por favor, selecciona un tipo de mensaje primero.');
                return;
            }
            
            if (!message) {
                alert('Por favor, escribe un mensaje.');
                return;
            }
            
            console.log(`📤 Enviando mensaje a ${selectedType}:`, message);
            alert(`Mensaje enviado a ${selectedType === 'lia' ? 'LIA' : 'Chat en Vivo'}: "${message}"`);
            
            liaMessageInput.value = '';
        });
        
        // Event listener para Enter
        liaMessageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                liaSendBtn.click();
            }
        });
        
        // Actualizar debug info inicial
        updateDebugInfo();
        
        console.log('🧪 Test inicializado correctamente');
    </script>
</body>
</html>
