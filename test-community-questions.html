<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Preguntas de Comunidad</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .question { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .question h3 { margin: 0 0 10px 0; color: #333; }
        .question p { color: #666; margin: 5px 0; }
        .stats { display: flex; gap: 15px; font-size: 0.9em; color: #888; }
        .demo { background-color: #f0f8ff; }
        .real { background-color: #f0fff0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>Test - Sistema de Preguntas de Comunidad</h1>
    
    <div>
        <button onclick="loadQuestions()">Cargar Preguntas</button>
        <button onclick="createTestQuestion()">Crear Pregunta de Prueba</button>
    </div>
    
    <div id="status" class="loading">Listo para probar...</div>
    
    <div id="questions-container"></div>

    <!-- Cargar dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://miwbzotcuaywpdbidpwo.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd2J6b3RjdWF5d3BkYmlkcHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTEyMjksImV4cCI6MjA3MDE4NzIyOX0.WBdRkgbS1sH6aKa4SfJnx4Y-e1WkJDX-bqSgO5T42K8';
        
        window.supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
        console.log('✅ Supabase inicializado');
    </script>
    
    <!-- Cargar community-api -->
    <script src="src/Chat-Online/api/community-api.js"></script>
    
    <script>
        let testCounter = 1;
        
        function setStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = type === 'error' ? 'error' : 'loading';
        }
        
        async function loadQuestions() {
            setStatus('Cargando preguntas...');
            const container = document.getElementById('questions-container');
            
            try {
                // Configurar usuario de prueba
                if (window.communityAPI) {
                    window.communityAPI.setCurrentUser({
                        id: 'test-user-123',
                        name: 'Usuario de Prueba'
                    });
                }
                
                // Cargar preguntas de la API
                const response = await window.communityAPI.getQuestions({
                    filter: 'all',
                    sort: 'recent'
                });
                
                console.log('📋 Respuesta de la API:', response);
                
                if (response.success && response.data) {
                    const questions = response.data;
                    setStatus(`✅ ${questions.length} preguntas cargadas desde la base de datos`);
                    
                    container.innerHTML = questions.map(q => `
                        <div class="question real">
                            <h3>🟢 REAL: ${q.title}</h3>
                            <p><strong>Contenido:</strong> ${q.content}</p>
                            <p><strong>Tags:</strong> ${(q.tags || []).join(', ')}</p>
                            <p><strong>Autor:</strong> ${q.users?.name || q.users?.display_name || 'Usuario'}</p>
                            <div class="stats">
                                <span>👍 ${q.votes_count || 0} votos</span>
                                <span>💬 ${q.answers_count || 0} respuestas</span>
                                <span>👁️ ${q.views_count || 0} vistas</span>
                                <span>📅 ${new Date(q.created_at).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    setStatus('⚠️ No se encontraron preguntas en la base de datos');
                    container.innerHTML = '<p>No hay preguntas guardadas en la base de datos aún.</p>';
                }
                
            } catch (error) {
                console.error('❌ Error cargando preguntas:', error);
                setStatus('❌ Error al cargar preguntas: ' + error.message, 'error');
                container.innerHTML = `<div class="question" style="background-color: #ffe6e6;">
                    <h3>Error</h3>
                    <p>${error.message}</p>
                </div>`;
            }
        }
        
        async function createTestQuestion() {
            setStatus('Creando pregunta de prueba...');
            
            try {
                const testQuestion = {
                    title: `Pregunta de Prueba #${testCounter}`,
                    content: `Esta es una pregunta de prueba creada el ${new Date().toLocaleString()}. ¿Funciona correctamente el guardado en la base de datos?`,
                    tags: ['Prueba', 'Test', 'ChatOnline'],
                    course_id: null,
                    module_id: null
                };
                
                console.log('📝 Creando pregunta:', testQuestion);
                
                const response = await window.communityAPI.createQuestion(testQuestion);
                
                console.log('✅ Respuesta:', response);
                
                if (response.success) {
                    setStatus(`✅ Pregunta #${testCounter} creada exitosamente`);
                    testCounter++;
                    
                    // Recargar preguntas automáticamente
                    setTimeout(() => {
                        loadQuestions();
                    }, 1000);
                } else {
                    setStatus('❌ Error al crear la pregunta', 'error');
                }
                
            } catch (error) {
                console.error('❌ Error creando pregunta:', error);
                setStatus('❌ Error: ' + error.message, 'error');
            }
        }
        
        // Inicialización
        window.onload = function() {
            console.log('🚀 Test página cargada');
            console.log('🔍 communityAPI disponible:', !!window.communityAPI);
            console.log('🔍 supabase disponible:', !!window.supabase);
            
            setStatus('✅ Página cargada - Listo para probar');
        };
    </script>
</body>
</html>
