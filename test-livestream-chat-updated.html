<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Chat Livestream Actualizado</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        
        .test-title {
            text-align: center;
            color: #44e5ff;
            margin-bottom: 20px;
        }
        
        .livestream-chat-input {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message-type-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .type-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .type-btn:hover {
            background: rgba(68, 229, 255, 0.1);
            color: #ffffff;
        }
        
        .type-btn.active {
            background: #44e5ff;
            color: #0a0a0a;
            border-color: #44e5ff;
            box-shadow: 0 2px 8px rgba(68, 229, 255, 0.3);
        }
        
        .type-btn i {
            font-size: 0.9rem;
        }
        
        .type-btn span {
            font-size: 0.7rem;
        }
        
        .input-wrapper {
            display: flex;
            gap: 8px;
        }
        
        input {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #44e5ff;
        }
        
        button {
            padding: 10px 12px;
            background: #44e5ff;
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            cursor: pointer;
            font-weight: 500;
        }
        
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .log {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2 class="test-title">Test - Chat Livestream Actualizado</h2>
        
        <div class="livestream-chat-input">
            <div class="message-type-selector" id="messageTypeSelector">
                <button class="type-btn" data-type="lia" title="Enviar a LIA (Chatbot)">
                    <i class='bx bx-brain'></i>
                    <span>LIA</span>
                </button>
            </div>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="livestreamMessageInput" 
                    placeholder="Selecciona LIA para preguntar..."
                    maxlength="200"
                >
                <button id="livestreamSendBtn" disabled title="Enviar mensaje">
                    <i class='bx bx-send'></i>
                </button>
            </div>
        </div>
        
        <div class="status" id="status">
            Estado: Sin tipo seleccionado
        </div>
        
        <div class="log" id="log">
            Log de eventos:
        </div>
    </div>

    <script>
        // Simular el estado del chat
        let livestreamChatState = {
            messageType: null
        };
        
        const messageInput = document.getElementById('livestreamMessageInput');
        const sendBtn = document.getElementById('livestreamSendBtn');
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        
        function logEvent(message) {
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }
        
        function updateStatus() {
            const type = livestreamChatState.messageType;
            status.textContent = `Estado: ${type ? `Tipo seleccionado: ${type.toUpperCase()}` : 'Sin tipo seleccionado'}`;
            
            // Habilitar/deshabilitar botón de envío
            sendBtn.disabled = !type || !messageInput.value.trim();
        }
        
        function updateInputPlaceholder() {
            const placeholders = {
                'lia': 'Pregunta algo a LIA...'
            };
            
            messageInput.placeholder = livestreamChatState.messageType 
                ? placeholders[livestreamChatState.messageType] 
                : 'Selecciona LIA para preguntar...';
        }
        
        // Inicializar selector de tipo de mensaje
        function initializeMessageTypeSelector() {
            const selector = document.getElementById('messageTypeSelector');
            const buttons = selector.querySelectorAll('.type-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remover clase active de todos los botones
                    buttons.forEach(b => b.classList.remove('active'));
                    
                    // Agregar clase active al botón clickeado
                    btn.classList.add('active');
                    
                    // Actualizar el estado del tipo de mensaje
                    livestreamChatState.messageType = btn.dataset.type;
                    
                    // Actualizar placeholder del input
                    updateInputPlaceholder();
                    updateStatus();
                    
                    logEvent(`Tipo de mensaje cambiado a: ${livestreamChatState.messageType}`);
                });
            });
            
            // No establecer tipo por defecto
            updateInputPlaceholder();
            updateStatus();
        }
        
        // Eventos del input
        messageInput.addEventListener('input', () => {
            updateStatus();
        });
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Verificar que se haya seleccionado un tipo de mensaje
            if (!livestreamChatState.messageType) {
                logEvent('ERROR: No se ha seleccionado tipo de mensaje');
                return;
            }
            
            logEvent(`Mensaje enviado: "${message}" (tipo: ${livestreamChatState.messageType})`);
            messageInput.value = '';
            updateStatus();
        }
        
        // Inicializar
        initializeMessageTypeSelector();
        logEvent('Sistema inicializado - Sin tipo seleccionado por defecto');
    </script>
</body>
</html>
