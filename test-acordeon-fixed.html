<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Acordeón Corregido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        
        .status {
            padding: 8px;
            border-radius: 4px;
            margin: 5px 0;
        }
        
        .success { background: rgba(0,255,0,0.1); border: 1px solid #0f0; }
        .error { background: rgba(255,0,0,0.1); border: 1px solid #f00; }
        .info { background: rgba(0,100,255,0.1); border: 1px solid #06f; }
        
        button {
            padding: 10px 15px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #0052a3;
        }
        
        /* Estilos del acordeón corregido */
        .modules-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            visibility: visible;
            overflow-y: auto;
            max-height: 400px;
            min-height: 200px;
            padding-right: 0.5rem;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(68, 229, 255, 0.3) transparent;
            position: relative;
        }
        
        .module-accordion { 
            border: 1px solid rgba(68,229,255,.12); 
            border-radius: 10px; 
            overflow: hidden; 
            position: relative;
            z-index: 1;
            background: rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        
        .module-accordion + .module-accordion { 
            margin-top: .5rem; 
        }
        
        .module-header {
            width: 100%; 
            background: rgba(255,255,255,.05); 
            color: white;
            border: 0; 
            text-align: left; 
            padding: .75rem 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            cursor: pointer; 
            transition: all .3s ease;
            position: relative;
            z-index: 2;
        }
        
        .module-header .icon {
            transition: transform .3s ease;
        }
        
        .module-header:hover { 
            background: rgba(68,229,255,.10); 
        }
        
        .video-sublist { 
            list-style: none; 
            margin: 0; 
            padding: .5rem 0; 
            background: rgba(255,255,255,.03); 
            position: relative;
            z-index: 1;
        }
        
        .video-item { 
            padding: .5rem 1rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            position: relative;
            z-index: 1;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .video-item:last-child {
            border-bottom: none;
        }
        
        .video-item:hover { 
            background: rgba(68,229,255,.08); 
        }
        
        .video-item .v-title { 
            color: white; 
            font-size: .92rem; 
            flex: 1;
            margin-right: 1rem;
        }
        
        .video-item .v-time  { 
            color: #ccc; 
            font-size: .82rem; 
            flex-shrink: 0;
        }
        
        .icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(68, 229, 255, 0.2);
            border-top: 2px solid #44e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #testResults {
            max-height: 400px;
            overflow-y: auto;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        
        pre {
            white-space: pre-wrap;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Test - Acordeón Corregido</h1>
        <p>Esta página prueba la implementación corregida del acordeón de módulos.</p>
        
        <div class="test-section">
            <h2>📚 Acordeón de Módulos</h2>
            <p>El acordeón ahora debería funcionar correctamente sin problemas de superposición.</p>
            
            <div class="modules-list" id="modulesList">
                <!-- Los módulos se cargarán dinámicamente aquí -->
                <div class="loading-modules">
                    <div class="loading-spinner"></div>
                    <span>Cargando módulos del curso...</span>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>🔧 Controles de Prueba</h2>
            <button type="button" onclick="loadTestModules()">Cargar Módulos de Prueba</button>
            <button type="button" onclick="clearModules()">Limpiar Módulos</button>
            <button type="button" onclick="testAccordion()">Probar Funcionalidad</button>
        </div>
        
        <div class="test-section">
            <h2>📊 Resultados de Pruebas</h2>
            <div id="testResults"></div>
        </div>
    </div>

    <script>
        let testModules = [];
        let testVideos = {};
        
        function log(message, type = 'info') {
            const results = document.getElementById('testResults');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            results.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
        }
        
        function loadTestModules() {
            clearResults();
            log('🔄 Cargando módulos de prueba...', 'info');

            // Datos de prueba
            testModules = [
                { id: '1', module_number: 1, title: 'Fundamentos de IA' },
                { id: '2', module_number: 2, title: 'Machine Learning Básico' },
                { id: '3', module_number: 3, title: 'Redes Neuronales' },
                { id: '4', module_number: 4, title: 'Aplicaciones Prácticas' }
            ];

            testVideos = {
                '1': [
                    { id: 'v1', video_title: 'Introducción a la IA', duration_seconds: 1800 },
                    { id: 'v2', video_title: 'Historia de la IA', duration_seconds: 1200 }
                ],
                '2': [
                    { id: 'v3', video_title: 'Conceptos de ML', duration_seconds: 2400 },
                    { id: 'v4', video_title: 'Tipos de Aprendizaje', duration_seconds: 1500 }
                ],
                '3': [
                    { id: 'v5', video_title: 'Perceptrón Simple', duration_seconds: 2000 }
                ],
                '4': [
                    { id: 'v6', video_title: 'Proyecto Final', duration_seconds: 3000 },
                    { id: 'v7', video_title: 'Deployment', duration_seconds: 1800 }
                ]
            };

            renderModules(testModules, testVideos);
            log('✅ Módulos de prueba cargados', 'success');
        }
        
        function clearModules() {
            const host = document.getElementById('modulesList');
            host.innerHTML = '<div class="loading-modules"><span>Módulos limpiados</span></div>';
            log('🧹 Módulos limpiados', 'info');
        }
        
        function testAccordion() {
            log('🧪 Probando funcionalidad del acordeón...', 'info');
            
            // Probar apertura/cierre
            const headers = document.querySelectorAll('.module-header');
            if (headers.length === 0) {
                log('❌ No hay headers de módulos para probar', 'error');
                return;
            }
            
            log(`✅ Encontrados ${headers.length} headers de módulos`, 'success');
            
            // Probar el primer módulo
            const firstHeader = headers[0];
            const firstList = firstHeader.nextElementSibling;
            
            if (firstList && firstList.classList.contains('video-sublist')) {
                log('✅ Estructura del acordeón correcta', 'success');
                
                // Simular click
                firstHeader.click();
                setTimeout(() => {
                    const isOpen = firstHeader.getAttribute('aria-expanded') === 'true';
                    log(`✅ Click en header: ${isOpen ? 'abierto' : 'cerrado'}`, 'success');
                }, 100);
            } else {
                log('❌ Estructura del acordeón incorrecta', 'error');
            }
        }
        
        function renderModules(modules = [], vidsByModule = {}) {
            const host = document.getElementById('modulesList');
            if (!host) return;
            host.innerHTML = '';

            modules.forEach((m, index) => {
                const two = (vidsByModule[m.id] || []).slice(0, 2);
                const acc = document.createElement('div');
                acc.className = 'module-accordion';
                acc.style.zIndex = modules.length - index; // Z-index decreciente para evitar superposiciones
                
                // Crear el header del módulo
                const header = document.createElement('button');
                header.className = 'module-header';
                header.setAttribute('aria-expanded', 'false');
                header.setAttribute('type', 'button');
                
                const headerContent = document.createElement('span');
                headerContent.textContent = `Módulo ${m.module_number || ''}: ${m.title || ''}`;
                
                const chevron = document.createElement('svg');
                chevron.className = 'icon';
                chevron.setAttribute('viewBox', '0 0 24 24');
                chevron.setAttribute('width', '16');
                chevron.setAttribute('height', '16');
                chevron.innerHTML = '<polyline points="6,9 12,15 18,9"/>';
                
                header.appendChild(headerContent);
                header.appendChild(chevron);
                
                // Crear la lista de videos
                const videoList = document.createElement('ul');
                videoList.className = 'video-sublist';
                videoList.hidden = true;
                
                if (two.length > 0) {
                    two.forEach(v => {
                        const videoItem = document.createElement('li');
                        videoItem.className = 'video-item';
                        videoItem.setAttribute('data-video-id', v.id);
                        
                        const title = document.createElement('span');
                        title.className = 'v-title';
                        title.textContent = v.video_title;
                        
                        const time = document.createElement('span');
                        time.className = 'v-time';
                        time.textContent = formatSeconds(v.duration_seconds);
                        
                        videoItem.appendChild(title);
                        videoItem.appendChild(time);
                        
                        // Evento click para el video
                        videoItem.addEventListener('click', () => {
                            log(`🎬 Video seleccionado: ${v.video_title}`, 'success');
                        });
                        
                        videoList.appendChild(videoItem);
                    });
                } else {
                    // Si no hay videos, mostrar mensaje
                    const noVideos = document.createElement('li');
                    noVideos.className = 'video-item';
                    noVideos.style.opacity = '0.6';
                    noVideos.innerHTML = '<span class="v-title">No hay videos disponibles</span>';
                    videoList.appendChild(noVideos);
                }
                
                // Evento click para el header del módulo
                header.addEventListener('click', () => {
                    const isOpen = header.getAttribute('aria-expanded') === 'true';
                    header.setAttribute('aria-expanded', String(!isOpen));
                    videoList.hidden = isOpen;
                    
                    // Rotar el chevron
                    chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
                    
                    log(`📚 Módulo ${m.module_number}: ${isOpen ? 'cerrado' : 'abierto'}`, 'info');
                });
                
                // Ensamblar el acordeón
                acc.appendChild(header);
                acc.appendChild(videoList);
                host.appendChild(acc);
            });
        }
        
        function formatSeconds(s = 0) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }
        
        // Inicialización automática
        window.addEventListener('load', () => {
            log('🔄 Página cargada - Sistema de acordeón listo para pruebas', 'info');
        });
    </script>
</body>
</html>
