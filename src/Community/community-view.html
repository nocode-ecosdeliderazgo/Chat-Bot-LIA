<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="supabase-url" content="https://miwbzotcuaywpdbidpwo.supabase.co">
    <meta name="supabase-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd2J6b3RjdWF5d3BkYmlkcHdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTEyMjksImV4cCI6MjA3MDE4NzIyOX0.IKXYAe1JBFc_pcaS6OjxKUVJePwnfHgc0sRO6WpJSBY">

    <!-- Dynamic title will be set by JavaScript -->
    <title id="dynamicTitle">Comunidad - Cargando...</title>

    <!-- Dynamic meta tags for SEO -->
    <meta id="dynamicDescription" name="description" content="Comunidad de Aprende y Aplica">
    <meta id="dynamicKeywords" name="keywords" content="comunidad, aprendizaje, IA">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="community.css">
    <link rel="stylesheet" href="community-view.css">
    <link rel="icon" type="image/x-icon" href="../assets/images/icono.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- BoxIcons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Global theme setup -->
    <script src="../scripts/global-theme-setup.js"></script>

    <!-- Auth Guard -->
    <script src="../utils/auth-guard.js"></script>
</head>
<body class="bg-glow-global" data-community="">
    <div class="particles-container"></div>

    <!-- Loading Overlay for Initial Load -->
    <div class="loading-overlay active" id="initialLoadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Cargando comunidad...</p>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="course-tabs">
        <button class="tab-button" onclick="location.href='../cursos.html'">
            <i class='bx bx-collection'></i>
            Talleres
        </button>
        <button class="tab-button" onclick="location.href='../apps-directory.html'">
            <i class='bx bx-grid-alt'></i>
            Directorio IA
        </button>
        <button class="tab-button" onclick="location.href='./community.html'">
            <i class='bx bx-group'></i>
            Comunidad
        </button>
        <button class="tab-button" onclick="location.href='../Notices/notices.html'">
            <i class='bx bx-news'></i>
            Noticias
        </button>
    </div>

    <!-- Profile Menu -->
    <button class="header-profile">
        <img src="../assets/images/icono.png" alt="Perfil" />
    </button>
    <div id="profileMenu" class="profile-menu">
        <div class="pm-header">
            <div class="pm-avatar"><img src="../assets/images/icono.png" alt="Perfil"/></div>
            <div>
                <div class="pm-name" id="pmName">Usuario</div>
                <div class="pm-email" id="pmEmail">user@example.com</div>
            </div>
        </div>
        <div class="pm-section">
            <div class="pm-item" onclick="location.href='../estadisticas.html'"><i class='bx bx-bar-chart-alt-2'></i> Mis Estadísticas</div>
            <div class="pm-item" onclick="location.href='../courses.html'"><i class='bx bx-book'></i> Mi aprendizaje</div>
        </div>
        <div class="pm-section">
            <div class="pm-item" onclick="location.href='../profile.html'"><i class='bx bx-user'></i> Editar perfil</div>
        </div>
        <div class="pm-section">
            <div class="pm-item" id="themeToggle" onclick="toggleTheme()">
                <div class="theme-icon-container">
                    <i class='bx bx-sun theme-icon-sun'></i>
                    <i class='bx bx-moon theme-icon-moon'></i>
                </div>
                Cambiar tema
            </div>
        </div>
        <div class="pm-section">
            <div class="pm-item" onclick="location.href='../index.html'"><i class='bx bx-log-out'></i> Cerrar sesión</div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent" style="display: none;">
        <!-- Breadcrumbs -->
        <nav class="breadcrumbs">
            <a href="../index.html">Inicio</a>
            <span class="separator">></span>
            <a href="./community.html">Comunidades</a>
            <span class="separator">></span>
            <span id="communityBreadcrumb">Cargando...</span>
        </nav>

        <!-- Community Header -->
        <section class="community-header">
            <div class="community-banner" id="communityBanner">
                <div class="banner-overlay"></div>
                <div class="community-header-content">
                    <div class="community-info">
                        <div class="community-avatar" id="communityAvatar">
                            <i class="bx bx-group"></i>
                        </div>
                        <div class="community-details">
                            <h1 class="community-title" id="communityTitle">Cargando...</h1>
                            <p class="community-description" id="communityDescription">Cargando descripción...</p>
                            <div class="community-stats" id="communityStats">
                                <div class="stat-item">
                                    <span class="stat-number" id="membersCount">0</span>
                                    <span class="stat-label">Miembros</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-number" id="postsCount">0</span>
                                    <span class="stat-label">Publicaciones</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="community-actions">
                        <button class="btn-back" onclick="location.href='./community.html'">
                            <i class="bx bx-arrow-back"></i>
                            Volver a Comunidades
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Community Navigation Tabs -->
        <section class="community-nav">
            <div class="container">
                <div class="nav-tabs" id="communityTabs">
                    <!-- Tabs will be dynamically generated based on community type -->
                </div>
            </div>
        </section>

        <!-- Community Content -->
        <section class="community-content">
            <div class="container">
                <div class="content-layout">
                    <!-- Main Content Area -->
                    <div class="content-main">
                        <!-- Tab Content will be dynamically loaded here -->
                        <div id="tabContent">
                            <div class="loading-content">
                                <div class="spinner"></div>
                                <p>Cargando contenido...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar -->
                    <aside class="content-sidebar" id="communitySidebar">
                        <!-- Sidebar content will be dynamically generated based on community type -->
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <!-- Error State (Hidden by default) -->
    <div class="error-state" id="errorState" style="display: none;">
        <div class="error-content">
            <div class="error-icon">
                <i class="bx bx-error-circle"></i>
            </div>
            <h2 id="errorTitle">Error</h2>
            <p id="errorMessage">Ha ocurrido un error inesperado</p>
            <div class="error-actions">
                <button class="btn-primary" onclick="location.reload()">Intentar de nuevo</button>
                <button class="btn-secondary" onclick="location.href='./community.html'">Volver a Comunidades</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="../scripts/particles.js"></script>
    <script src="../scripts/main.js"></script>
    <script src="../scripts/supabase-client.js"></script>
    <script src="../utils/auth-utils.js"></script>
    <script src="../scripts/community-database.js"></script>
    <script src="community-view.js"></script>

    <!-- Verification script -->
    <script>
        console.log('🔍 Verificando dependencias críticas para community-view...');

        // Verify critical dependencies
        setTimeout(() => {
            console.log('📊 Estado de dependencias:');
            console.log('  window.supabase:', window.supabase ? 'Disponible' : 'No disponible');
            console.log('  window.CommunityDatabase:', typeof window.CommunityDatabase);
            console.log('  window.CommunityView:', typeof window.CommunityView);

            if (typeof window.CommunityView === 'function') {
                console.log('✅ CommunityView está disponible');
            } else {
                console.error('❌ CommunityView NO está disponible');
            }
        }, 1000);
    </script>

    <!-- Profile and theme scripts -->
    <script src="../scripts/profile-avatar-manager.js"></script>
    <script src="../scripts/force-theme-init.js"></script>
    <script src="../scripts/theme-manager.js"></script>
</body>
</html>
