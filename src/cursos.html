<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talleres — Explora y Aprende</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/cursos.css" />
    <!-- Estilos del navbar de pestañas reutilizado -->
    <link rel="stylesheet" href="styles/courses.css" />
    <!-- Estilos del login para las partículas -->
    <link rel="stylesheet" href="login/new-auth.css" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" href="assets/images/icono.png" />

    <!-- Navbar Global CSS - Sistema unificado con máxima prioridad -->
    <link rel="stylesheet" href="styles/navbar-global.css">

    <!-- Auth Guard - Protección de autenticación -->
    <script src="utils/auth-guard.js"></script>
    
    <!-- Global theme setup - Configuración global del tema -->
    <script src="scripts/global-theme-setup.js"></script>
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="scripts/supabase-client.js" defer></script>
</head>
<body class="bg-glow-global courses-page">
    <!-- Contenedor principal con fondo limpio -->
    <div class="auth-container">
        <div class="auth-bg">
            <div class="bg-glow"></div>
        </div>

    <!-- Navigation Bar - Sistema Global -->
    <div id="navbar-container"></div>

    <main class="container">
        <!-- Barra de búsqueda y Filtros DEBAJO del header -->
        <div class="search">
            <i class='bx bx-search'></i>
            <input id="catalogSearch" type="text" placeholder="Buscar talleres, temas o instructores…" />
        </div>
        <nav class="catalog-categories" id="catalogTabs">
            <button class="cat-tab active" data-cat="todos">Todos</button>
            <button class="cat-tab" data-cat="favoritos">Favoritos</button>
            <button class="cat-tab" data-cat="ia">IA</button>
            <button class="cat-tab" data-cat="datos">Datos</button>
            <button class="cat-tab" data-cat="desarrollo">Desarrollo</button>
            <button class="cat-tab" data-cat="diseño">Diseño</button>
            <button class="cat-tab" data-cat="it">IT & Software</button>
            <button class="cat-tab" data-cat="marketing">Marketing</button>
            <button class="cat-tab" data-cat="negocios">Negocios</button>
        </nav>
        <section class="hero-intro">
            <div class="hero-copy">
                <h1>Explora. Aprende. Crece.</h1>
                <p>Descubre talleres cuidadosamente seleccionados por categorías. Animaciones suaves, glassmorphism y un fondo con partículas para una experiencia moderna y fluida.</p>
            </div>
            <div class="hero-cta">
                <a class="btn btn-primary" href="#grid">Ver talleres destacados</a>
            </div>
        </section>

        <section id="grid" class="courses-grid"></section>
    </main>
    </div> <!-- Cierre del auth-container -->

    <script src="scripts/main.js"></script>
    <script src="scripts/dynamic-course-loader.js"></script>
    <script src="scripts/cursos.js"></script>
    <script src="scripts/profile-avatar-manager.js"></script>
    <script src="scripts/force-theme-init.js"></script>
    <script src="scripts/theme-manager.js"></script>
    <script src="scripts/theme-toggle.js"></script>

    <!-- Navbar Global - Sistema unificado -->
    <script src="scripts/navbar-global.js"></script>
    <script>
        // Inicializar navbar global para Cursos
        document.addEventListener('DOMContentLoaded', function() {
            NavbarGlobal.init('cursos', 'cursos');
        });
    </script>
</body>
</html>
