<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Posts de Comunidad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .debug-box {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        .info { color: #17a2b8; font-weight: bold; }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🐛 Debug Posts de Comunidad</h1>

    <div class="debug-box">
        <h3>📍 Información Actual</h3>
        <p><strong>URL:</strong> <span id="currentUrl"></span></p>
        <p><strong>Slug:</strong> <span id="currentSlug"></span></p>
    </div>

    <div class="debug-box">
        <h3>🏗️ Estado del Sistema</h3>
        <button onclick="checkSystemState()">Verificar Estado</button>
        <div id="systemState"></div>
    </div>

    <div class="debug-box">
        <h3>🏘️ Identificación de Comunidad</h3>
        <button onclick="testCommunityIdentification()">Test Identificación</button>
        <div id="communityResult"></div>
    </div>

    <div class="debug-box">
        <h3>📝 Test de Post</h3>
        <button onclick="simulatePostCreation()">Simular Creación Post</button>
        <div id="postResult"></div>
    </div>

    <script>
        // Actualizar info actual
        function updateCurrentInfo() {
            document.getElementById('currentUrl').textContent = window.location.href;
            const urlParams = new URLSearchParams(window.location.search);
            document.getElementById('currentSlug').textContent = urlParams.get('slug') || 'ninguno';
        }

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            element.innerHTML += `<div class="${className}">${message}</div>`;
            console.log(message);
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        function checkSystemState() {
            clearLog('systemState');
            log('systemState', '🔍 Verificando estado del sistema...');

            // Verificar ventana global
            log('systemState', `window.supabase: ${!!window.supabase ? '✅' : '❌'}`, window.supabase ? 'success' : 'error');
            log('systemState', `window.communitySystem: ${!!window.communitySystem ? '✅' : '❌'}`, window.communitySystem ? 'success' : 'error');
            log('systemState', `window.CommunityDatabase: ${!!window.CommunityDatabase ? '✅' : '❌'}`, window.CommunityDatabase ? 'success' : 'error');

            // Verificar localStorage
            const savedCommunities = localStorage.getItem('savedCommunities');
            log('systemState', `localStorage savedCommunities: ${!!savedCommunities ? '✅' : '❌'}`, savedCommunities ? 'success' : 'error');

            if (savedCommunities) {
                try {
                    const communities = JSON.parse(savedCommunities);
                    log('systemState', `Comunidades en localStorage: ${communities.length}`, 'info');
                } catch (e) {
                    log('systemState', 'Error parseando savedCommunities', 'error');
                }
            }

            // Estado de CommunitySystem
            if (window.communitySystem) {
                log('systemState', `CommunitySystem.currentCommunity: ${!!window.communitySystem.currentCommunity ? '✅' : '❌'}`, window.communitySystem.currentCommunity ? 'success' : 'error');
                if (window.communitySystem.currentCommunity) {
                    log('systemState', `Comunidad actual: ${window.communitySystem.currentCommunity.name}`, 'success');
                    log('systemState', `ID: ${window.communitySystem.currentCommunity.id}`, 'info');
                }
            }
        }

        function testCommunityIdentification() {
            clearLog('communityResult');
            log('communityResult', '🏘️ Probando identificación de comunidad...');

            const urlParams = new URLSearchParams(window.location.search);
            const communitySlug = urlParams.get('slug') || 'profesionales';
            log('communityResult', `Slug de URL: ${communitySlug}`, 'info');

            let communityId = null;
            let communityName = 'Desconocida';

            // MÉTODO 1: CommunitySystem
            if (window.communitySystem && window.communitySystem.currentCommunity) {
                communityId = window.communitySystem.currentCommunity.id;
                communityName = window.communitySystem.currentCommunity.name;
                log('communityResult', `✅ Método 1 (CommunitySystem): ${communityName} (${communityId})`, 'success');
            } else {
                log('communityResult', '❌ Método 1 (CommunitySystem): No disponible', 'error');
            }

            // MÉTODO 2: localStorage
            if (!communityId) {
                const savedCommunities = localStorage.getItem('savedCommunities');
                if (savedCommunities) {
                    try {
                        const communities = JSON.parse(savedCommunities);
                        const community = communities.find(c => c.slug === communitySlug);
                        if (community) {
                            communityId = community.id;
                            communityName = community.name;
                            log('communityResult', `✅ Método 2 (localStorage): ${communityName} (${communityId})`, 'success');
                        } else {
                            log('communityResult', `❌ Método 2 (localStorage): No encontrado slug '${communitySlug}'`, 'error');
                        }
                    } catch (e) {
                        log('communityResult', '❌ Método 2 (localStorage): Error parseando', 'error');
                    }
                } else {
                    log('communityResult', '❌ Método 2 (localStorage): No hay datos', 'error');
                }
            }

            // MÉTODO 3: Hardcoded
            if (!communityId) {
                const hardcodedCommunities = {
                    'profesionales': { id: '7886aa14-35b9-41da-b099-29ff1ad3516b', name: 'Profesionales' },
                    'sif-icap': { id: 'aa5a4c4c-ce64-4a12-b1ef-365aa0d320c8', name: 'SIF ICAP' },
                    'openminder': { id: 'b3b154e1-110e-4aa7-8998-ef208482a159', name: 'Openminder' },
                    'ecos-de-liderazgo': { id: 'd2dbebb1-5b57-4da7-9fc6-8b40c732b548', name: 'Ecos de Liderazgo' }
                };

                if (hardcodedCommunities[communitySlug]) {
                    communityId = hardcodedCommunities[communitySlug].id;
                    communityName = hardcodedCommunities[communitySlug].name;
                    log('communityResult', `✅ Método 3 (Hardcoded): ${communityName} (${communityId})`, 'success');
                } else {
                    log('communityResult', `❌ Método 3 (Hardcoded): No encontrado slug '${communitySlug}'`, 'error');
                }
            }

            // Resultado final
            if (communityId) {
                log('communityResult', `🎯 RESULTADO FINAL: ${communityName} (${communityId})`, 'success');
            } else {
                log('communityResult', '🚨 ERROR: No se pudo identificar la comunidad', 'error');
            }
        }

        function simulatePostCreation() {
            clearLog('postResult');
            log('postResult', '📝 Simulando creación de post...');

            // Primero identificar la comunidad
            const urlParams = new URLSearchParams(window.location.search);
            const communitySlug = urlParams.get('slug') || 'profesionales';

            let communityId = null;
            let communityName = 'Desconocida';

            // Usar la misma lógica que el sistema real
            if (window.communitySystem && window.communitySystem.currentCommunity) {
                communityId = window.communitySystem.currentCommunity.id;
                communityName = window.communitySystem.currentCommunity.name;
            } else {
                const savedCommunities = localStorage.getItem('savedCommunities');
                if (savedCommunities) {
                    try {
                        const communities = JSON.parse(savedCommunities);
                        const community = communities.find(c => c.slug === communitySlug);
                        if (community) {
                            communityId = community.id;
                            communityName = community.name;
                        }
                    } catch (e) {}
                }
            }

            if (!communityId) {
                const hardcodedCommunities = {
                    'profesionales': { id: '7886aa14-35b9-41da-b099-29ff1ad3516b', name: 'Profesionales' },
                    'sif-icap': { id: 'aa5a4c4c-ce64-4a12-b1ef-365aa0d320c8', name: 'SIF ICAP' },
                    'openminder': { id: 'b3b154e1-110e-4aa7-8998-ef208482a159', name: 'Openminder' },
                    'ecos-de-liderazgo': { id: 'd2dbebb1-5b57-4da7-9fc6-8b40c732b548', name: 'Ecos de Liderazgo' }
                };

                if (hardcodedCommunities[communitySlug]) {
                    communityId = hardcodedCommunities[communitySlug].id;
                    communityName = hardcodedCommunities[communitySlug].name;
                }
            }

            if (communityId) {
                log('postResult', `✅ Comunidad identificada: ${communityName}`, 'success');
                log('postResult', `🆔 Community ID: ${communityId}`, 'info');

                // Simular datos del post
                const postData = {
                    community_id: communityId,
                    content: 'Este es un post de prueba desde el sistema de debug',
                    title: null,
                    attachment_url: null,
                    attachment_type: null
                };

                log('postResult', '📋 Datos del post que se enviarían:', 'info');
                log('postResult', `<pre>${JSON.stringify(postData, null, 2)}</pre>`, 'info');
                log('postResult', '🎉 SIMULACIÓN EXITOSA - El post se crearían correctamente', 'success');
            } else {
                log('postResult', '🚨 ERROR: No se pudo identificar la comunidad', 'error');
                log('postResult', 'El post NO se puede crear sin community_id', 'error');
            }
        }

        // Inicializar
        window.addEventListener('load', () => {
            updateCurrentInfo();
            console.log('🐛 Debug tool cargado');
        });
    </script>
</body>
</html>
