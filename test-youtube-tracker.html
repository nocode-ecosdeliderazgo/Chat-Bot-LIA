<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test YouTube Progress Tracker</title>
</head>
<body>
    <h1>🧪 Test YouTube Progress Tracker</h1>
    
    <div id="status">Cargando...</div>
    
    <div id="youtubePlayer" style="width: 640px; height: 360px;"></div>
    
    <script>
        console.log('🚀 Iniciando test...');
        
        let componentsReady = {
            courseProgressManager: false,
            youtubeProgressTracker: false
        };
        
        // Verificar carga de scripts
        function checkScripts() {
            const status = document.getElementById('status');
            
            if (typeof window.YouTubeProgressTracker === 'undefined') {
                status.innerHTML = '⏳ Esperando YouTubeProgressTracker...';
                status.style.color = 'orange';
                console.log('⏳ YouTubeProgressTracker aún no disponible');
                return false;
            }
            
            if (typeof window.CourseProgressManager === 'undefined') {
                status.innerHTML = '⏳ Esperando CourseProgressManager...';
                status.style.color = 'orange';
                console.log('⏳ CourseProgressManager aún no disponible');
                return false;
            }
            
            status.innerHTML = '✅ Scripts cargados, esperando inicialización...';
            status.style.color = 'blue';
            console.log('✅ Scripts cargados, esperando inicialización...');
            return true;
        }
        
        // Esperar a que se carguen los scripts
        function waitForScripts() {
            if (checkScripts()) {
                // Los scripts están cargados, ahora esperar a que se inicialicen
                waitForComponents();
            } else {
                setTimeout(waitForScripts, 100);
            }
        }
        
        // Esperar a que los componentes estén inicializados
        function waitForComponents() {
            const status = document.getElementById('status');
            
            if (componentsReady.courseProgressManager && componentsReady.youtubeProgressTracker) {
                status.innerHTML = '✅ Todos los componentes inicializados';
                status.style.color = 'green';
                console.log('✅ Todos los componentes están listos');
                testTracker();
                return;
            }
            
            status.innerHTML = `⏳ Esperando componentes... (CPM: ${componentsReady.courseProgressManager ? '✅' : '⏳'}, YPT: ${componentsReady.youtubeProgressTracker ? '✅' : '⏳'})`;
            status.style.color = 'orange';
            console.log('⏳ Esperando componentes...', componentsReady);
            
            setTimeout(waitForComponents, 100);
        }
        
        // Probar el tracker
        function testTracker() {
            try {
                console.log('🧪 Probando YouTubeProgressTracker...');
                
                // Crear instancia del CourseProgressManager
                const progressManager = new window.CourseProgressManager();
                console.log('✅ CourseProgressManager creado:', progressManager);
                
                // Crear instancia del YouTubeProgressTracker
                const tracker = new window.YouTubeProgressTracker(progressManager);
                console.log('✅ YouTubeProgressTracker creado:', tracker);
                
                // Inicializar player
                tracker.initializePlayer('youtubePlayer', 'Yy_eZ65jzmo', 1);
                console.log('✅ Player inicializado');
                
                document.getElementById('status').innerHTML = '🎉 ¡Todo funcionando correctamente!';
                
            } catch (error) {
                console.error('❌ Error en test:', error);
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
                document.getElementById('status').style.color = 'red';
            }
        }
        
        // Escuchar eventos de componentes listos
        window.addEventListener('courseProgressManagerReady', (event) => {
            console.log('🎯 CourseProgressManager listo:', event.detail);
            componentsReady.courseProgressManager = true;
        });
        
        window.addEventListener('youtubeProgressTrackerReady', (event) => {
            console.log('🎯 YouTubeProgressTracker listo:', event.detail);
            componentsReady.youtubeProgressTracker = true;
        });
        
        // Iniciar test cuando se cargue la página
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📄 DOM cargado, iniciando test...');
            waitForScripts();
        });
    </script>
    
    <!-- Cargar scripts en orden -->
    <script src="../scripts/course-progress-manager.js"></script>
    <script src="../scripts/youtube-progress-tracker.js"></script>
</body>
</html>
